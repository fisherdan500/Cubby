services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cubby_integrity_acceptance
      POSTGRES_USER: cubby_integrity_acceptance
      POSTGRES_PASSWORD: ${CUBBY_INTEGRITY_ACCEPTANCE_PASSWORD:?synthetic password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubby_integrity_acceptance -d cubby_integrity_acceptance"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "127.0.0.1::5432"
    volumes:
      - integrity_acceptance_data:/var/lib/postgresql/data

volumes:
  integrity_acceptance_data:
