services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cubby_first_account_acceptance
      POSTGRES_USER: cubby_first_account_acceptance
      POSTGRES_PASSWORD: ${CUBBY_FIRST_ACCOUNT_ACCEPTANCE_PASSWORD:?synthetic password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubby_first_account_acceptance -d cubby_first_account_acceptance"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "127.0.0.1::5432"
    volumes:
      - first_account_acceptance_data:/var/lib/postgresql/data

volumes:
  first_account_acceptance_data:
