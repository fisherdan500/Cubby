services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cubby_overnight_log_acceptance
      POSTGRES_USER: cubby_overnight_log_acceptance
      POSTGRES_PASSWORD: ${CUBBY_PHOTO_UPLOAD_ACCEPTANCE_PASSWORD:?synthetic password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubby_overnight_log_acceptance -d cubby_overnight_log_acceptance"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "127.0.0.1::5432"
    volumes:
      - overnight_log_acceptance_data:/var/lib/postgresql/data

volumes:
  overnight_log_acceptance_data:
