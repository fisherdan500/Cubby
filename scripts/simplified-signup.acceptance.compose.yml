# Disposable services for the simplified invitation signup acceptance rehearsal.
# Derived from admin-assisted-accounts.acceptance.compose.yml (PR #180) so the role/grant
# topology matches production exactly: the app's own entrypoint provisions cubby_runtime,
# cubby_auth, cubby_invitation_runtime and the rest before applying migrations.
# Every secret is generated per run by the driver; nothing here is a real credential.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cubby_simplified_signup
      POSTGRES_USER: cubby_signup_rehearsal
      POSTGRES_PASSWORD: ${CUBBY_SIGNUP_REHEARSAL_PASSWORD:?signup rehearsal password required}
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubby_signup_rehearsal -d cubby_simplified_signup"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1::5432"
    volumes:
      - signup_rehearsal_postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # MIGRATION_DATABASE_URL is the rehearsal's bootstrap superuser; every other role below is
      # created/rotated at startup by the app's own provisioning scripts, exactly as
      # docker-compose.yml's cubby_migrator/cubby_runtime/etc. split works in production. That
      # includes cubby_runtime's REVOKE of UPDATE on "Session" (20260824140000_global_security_foundation)
      # - the exact grant PR #76 restored via SECURITY DEFINER lock functions instead of loosening it.
      MIGRATION_DATABASE_URL: postgresql://cubby_signup_rehearsal:${CUBBY_SIGNUP_REHEARSAL_PASSWORD:?signup rehearsal password required}@postgres:5432/cubby_simplified_signup?schema=public
      DATABASE_URL: postgresql://cubby_runtime:${CUBBY_SIGNUP_REHEARSAL_RUNTIME_PASSWORD:?rehearsal runtime password required}@postgres:5432/cubby_simplified_signup?schema=public
      AUTH_DATABASE_URL: postgresql://cubby_auth:${CUBBY_SIGNUP_REHEARSAL_AUTH_DB_PASSWORD:?rehearsal auth db password required}@postgres:5432/cubby_simplified_signup?schema=public
      EMAIL_DELIVERY_DATABASE_URL: postgresql://cubby_email_delivery:${CUBBY_SIGNUP_REHEARSAL_EMAIL_DELIVERY_DB_PASSWORD:?rehearsal email delivery db password required}@postgres:5432/cubby_simplified_signup?schema=public
      CUBBY_SECURITY_OPERATOR_DB_PASSWORD: ${CUBBY_SIGNUP_REHEARSAL_SECURITY_OPERATOR_PASSWORD:?rehearsal security operator password required}
      CUBBY_THROTTLE_KEY: ${CUBBY_SIGNUP_REHEARSAL_THROTTLE_KEY:?rehearsal throttle key required}
      CUBBY_FRESH_AUTH_ATTESTATION_KEYRING: ${CUBBY_SIGNUP_REHEARSAL_FRESH_AUTH_KEYRING:?rehearsal fresh-auth keyring required}
      CUBBY_FRESH_AUTH_ATTESTATION_ACTIVE_KEY_VERSION: "1"
      CUBBY_EMAIL_DELIVERY_KEYRING: ${CUBBY_SIGNUP_REHEARSAL_EMAIL_DELIVERY_KEYRING:?rehearsal email-delivery keyring required}
      CUBBY_EMAIL_DELIVERY_ACTIVE_KEY_VERSION: "1"
      # The email-delivery worker's startup tick constructs its SMTP adapter eagerly even with an
      # empty delivery queue, so config must be present; these values are never actually reached
      # since the rehearsal never queues an email (same placeholder pattern the disposable backup
      # and P1-3 invitation harnesses already use successfully).
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1"
      SMTP_USER: cubby_signup_rehearsal_smtp
      SMTP_PASSWORD: ${CUBBY_SIGNUP_REHEARSAL_SMTP_PASSWORD:?rehearsal smtp password required}
      EMAIL_FROM: Cubby <noreply@rehearsal.invalid>
      SMTP_SECURE: "false"
      BETTER_AUTH_SECRET: ${CUBBY_SIGNUP_REHEARSAL_AUTH_SECRET:?rehearsal auth secret required}
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_ORIGINS: http://127.0.0.1:*
      APP_TIMEZONE: Etc/UTC
      ENABLE_REGISTRATION: "false"
      AUTOMATED_BACKUPS_ENABLED: "false"
      INTEGRITY_CHECKS_ENABLED: "false"
      CUBBY_INVITATION_RUNTIME_DB_PASSWORD: ${CUBBY_SIGNUP_REHEARSAL_INVITATION_RUNTIME_PASSWORD:?rehearsal invitation runtime password required}
      CUBBY_INVITATION_EXPIRY_DB_PASSWORD: ${CUBBY_SIGNUP_REHEARSAL_INVITATION_EXPIRY_PASSWORD:?rehearsal invitation expiry password required}
      CUBBY_INVITATION_MAINTENANCE_DB_PASSWORD: ${CUBBY_SIGNUP_REHEARSAL_INVITATION_MAINTENANCE_PASSWORD:?rehearsal invitation maintenance password required}
      INVITATION_DATABASE_URL: postgresql://cubby_invitation_runtime:${CUBBY_SIGNUP_REHEARSAL_INVITATION_RUNTIME_PASSWORD:?rehearsal invitation runtime password required}@postgres:5432/cubby_simplified_signup?schema=public
      INVITATION_EXPIRY_DATABASE_URL: postgresql://cubby_invitation_expiry_worker:${CUBBY_SIGNUP_REHEARSAL_INVITATION_EXPIRY_PASSWORD:?rehearsal invitation expiry password required}@postgres:5432/cubby_simplified_signup?schema=public
      INVITATION_MAINTENANCE_DATABASE_URL: postgresql://cubby_invitation_maintenance_worker:${CUBBY_SIGNUP_REHEARSAL_INVITATION_MAINTENANCE_PASSWORD:?rehearsal invitation maintenance password required}@postgres:5432/cubby_simplified_signup?schema=public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 60s
    ports:
      - "127.0.0.1::3000"

volumes:
  signup_rehearsal_postgres_data:
