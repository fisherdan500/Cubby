services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cubby_baby_acceptance
      POSTGRES_USER: cubby_baby_acceptance
      POSTGRES_PASSWORD: ${CUBBY_BABY_ACCEPTANCE_PASSWORD:?synthetic password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubby_baby_acceptance -d cubby_baby_acceptance"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "127.0.0.1::5432"
    volumes:
      - baby_acceptance_data:/var/lib/postgresql/data

volumes:
  baby_acceptance_data:
