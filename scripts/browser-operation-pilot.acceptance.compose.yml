services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CUBBY_BROWSER_OPERATION_ACCEPTANCE_DATABASE:?generated database required}
      POSTGRES_USER: ${CUBBY_BROWSER_OPERATION_ACCEPTANCE_USER:?generated user required}
      POSTGRES_PASSWORD: ${CUBBY_BROWSER_OPERATION_ACCEPTANCE_PASSWORD:?generated password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "127.0.0.1::5432"
    volumes:
      - browser_operation_acceptance_data:/var/lib/postgresql/data

volumes:
  browser_operation_acceptance_data:
