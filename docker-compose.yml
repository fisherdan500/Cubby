services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cubby
      POSTGRES_USER: cubby_migrator
      POSTGRES_PASSWORD: ${CUBBY_MIGRATOR_DB_PASSWORD:?Set CUBBY_MIGRATOR_DB_PASSWORD}
      CUBBY_RUNTIME_DB_PASSWORD: ${CUBBY_RUNTIME_DB_PASSWORD:?Set CUBBY_RUNTIME_DB_PASSWORD}
      CUBBY_AUTH_DB_PASSWORD: ${CUBBY_AUTH_DB_PASSWORD:?Set CUBBY_AUTH_DB_PASSWORD}
      CUBBY_EMAIL_DELIVERY_DB_PASSWORD: ${CUBBY_EMAIL_DELIVERY_DB_PASSWORD:?Set CUBBY_EMAIL_DELIVERY_DB_PASSWORD}
      TZ: ${APP_TIMEZONE:-America/New_York}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubby_migrator -d cubby"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - cubby_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE:-America/New_York}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/New_York}
      DATABASE_URL: postgresql://cubby_runtime:${CUBBY_RUNTIME_DB_PASSWORD:?Set CUBBY_RUNTIME_DB_PASSWORD}@postgres:5432/cubby?schema=public
      MIGRATION_DATABASE_URL: postgresql://cubby_migrator:${CUBBY_MIGRATOR_DB_PASSWORD:?Set CUBBY_MIGRATOR_DB_PASSWORD}@postgres:5432/cubby?schema=public
      AUTH_DATABASE_URL: postgresql://cubby_auth:${CUBBY_AUTH_DB_PASSWORD:?Set CUBBY_AUTH_DB_PASSWORD}@postgres:5432/cubby?schema=public
      EMAIL_DELIVERY_DATABASE_URL: postgresql://cubby_email_delivery:${CUBBY_EMAIL_DELIVERY_DB_PASSWORD:?Set CUBBY_EMAIL_DELIVERY_DB_PASSWORD}@postgres:5432/cubby?schema=public
      CUBBY_SECURITY_OPERATOR_DB_PASSWORD: ${CUBBY_SECURITY_OPERATOR_DB_PASSWORD:?Set CUBBY_SECURITY_OPERATOR_DB_PASSWORD}
      CUBBY_THROTTLE_KEY: ${CUBBY_THROTTLE_KEY:?Set CUBBY_THROTTLE_KEY}
      CUBBY_TRUSTED_PROXY_HOPS: ${CUBBY_TRUSTED_PROXY_HOPS:-0}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    volumes:
      - ${CUBBY_BACKUP_HOST_DIR:-./docker-data/backups}:/var/lib/cubby/backups
      - ${CUBBY_SPROUT_STAGING_HOST_DIR:-./docker-data/sprout-staging}:/var/lib/cubby/sprout-staging
    secrets:
      - cubby_sprout_staging_key
    restart: unless-stopped

volumes:
  cubby_postgres_data:

secrets:
  cubby_sprout_staging_key:
    file: ${CUBBY_SPROUT_STAGING_KEY_FILE:?Set CUBBY_SPROUT_STAGING_KEY_FILE to the master-key secret file}
