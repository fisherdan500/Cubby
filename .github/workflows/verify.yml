name: verify

# Runs Cubby's verification gates on every pull request and on main, through the same
# `verify:gates` runner a person runs locally, so the two cannot drift apart.
#
# Nothing here touches a household's data or deployment: the disposable rehearsals boot their own
# throwaway PostgreSQL inside the runner and tear it down again.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  canonical:
    name: canonical gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run verify:gates
      # The operation registry's generated artifacts are byte-compared, so a mismatch says only that
      # they differ. This shows what a regeneration here would write, which is the difference itself.
      - name: show what the registry would regenerate
        if: failure()
        run: |
          npm run operation-registry:generate || true
          git --no-pager diff --stat -- src/server/operation-registry/generated
          git --no-pager diff --unified=0 -- src/server/operation-registry/generated/fingerprints.json | head -c 20000

  disposable:
    name: disposable rehearsals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Each rehearsal starts and removes its own Compose project; the runner's Docker is enough.
      - run: npm run verify:gates:disposable

  image:
    name: image rehearsals
    runs-on: ubuntu-latest
    # These build the application image before they can run, so they are slower than the rehearsals
    # above and are given their own job rather than being left out of CI for being slow. They share
    # one job deliberately: both build the same context and Dockerfile, so the second build reuses
    # the first one's layers instead of paying for it again.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run verify:gates:image
